# Mock Home Assistant ingress (paseo/tests/ingress). Mimics how the HA
# Supervisor proxies the add-on panel: serves /api/hassio_ingress/<token>/
# on the HA port, strips that prefix before forwarding to the add-on's
# ingress port and adds the X-Ingress-Path header. WebSocket upgrades and
# long-lived connections are proxied like the real thing.
events {}
http {
    # Docker's embedded DNS, needed because proxy_pass uses a variable.
    resolver 127.0.0.11 valid=30s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    server {
        listen 8123;
        location ~ ^/api/hassio_ingress/[^/]+(/.*)$ {
            # Rendered by run.sh: @TARGET@ = add-on ingress address, @PREFIX@ =
            # the ingress path HA would use.
            proxy_pass http://@TARGET@$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Ingress-Path "@PREFIX@";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location / {
            return 200 '<html><body>mock HA home</body></html>';
        }
    }
}