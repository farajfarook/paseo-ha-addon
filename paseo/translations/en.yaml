configuration:
  workspace:
    name: Workspace
    description: Directory new terminals and agent sessions start in. Created if missing. Defaults to the Home Assistant configuration (/homeassistant).
  git_snapshot:
    name: Git snapshots
    description: Keep /homeassistant under git (initialised once, secrets and runtime files ignored) so agent changes can be reviewed and reverted. Never modifies an existing repository.
  agents:
    name: Extra agents
    description: Additional agent CLIs to install persistently next to the bundled Pi (claude-code, codex, opencode). Installed on start; deselected agents are removed.
  env_vars:
    name: Environment variables
    description: Variables (e.g. ANTHROPIC_API_KEY, OPENAI_API_KEY) exported to the Paseo daemon and every agent. Only names are logged, never values.
  password:
    name: Direct port password
    description: Required to enable the direct port 6767 for Paseo apps/CLI. Without it a mapped port stays closed. The sidebar never asks for it.
  hostnames:
    name: Extra hostnames
    description: Additional DNS names the daemon accepts on the direct port (PASEO_HOSTNAMES), e.g. paseo.example.com.
  log_level:
    name: Log level
    description: Paseo daemon console log level.
  dictation:
    name: Dictation
    description: Enable speech-to-text dictation. With the local provider this downloads speech models (~0.6–1 GB) into persistent storage.
  voice_mode:
    name: Voice mode
    description: Enable full voice conversations. With the local provider this downloads speech models (~0.6–1 GB) into persistent storage.
  speech_provider:
    name: Speech provider
    description: "local: on-device models (may be unavailable on armv7/musl). openai: uses OpenAI, requires OPENAI_API_KEY in environment variables."
  worktrees_root:
    name: Worktrees location
    description: Directory where Paseo creates git worktrees (e.g. /share/paseo-worktrees). Empty uses persistent add-on storage.
  relay:
    name: Relay
    description: Force Paseo's encrypted relay on or off. Leave unset to control it from Paseo's "Pair device" screen.
network:
  6767/tcp: Direct Paseo access for apps/CLI (requires password)
