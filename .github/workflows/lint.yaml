name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-linter:
    name: Add-on configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./paseo
          community: false

  documentation:
    name: Documentation and pins
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Options coverage in DOCS.md, translations, CHANGELOG/version and the
      # Paseo/Pi pins agreeing across build.yaml, Dockerfile and config.yaml.
      - name: Run documentation checks
        run: bash paseo/tests/docs/run.sh

      # Ingress anchors of the pinned Paseo release: fails if the web UI stops
      # exposing an asset path, the "/ws" path or the connection hint that the
      # nginx sub_filter rules and shim depend on (see README 'Bumping Paseo').
      - name: Check the ingress anchors of the pinned Paseo
        run: |
          pin="$(awk '/^ *PASEO_VERSION:/{print $2; exit}' paseo/build.yaml)"
          bash .github/scripts/paseo-anchors.sh --check "${pin}"

      # The `providers` option must list exactly the built-in providers of the
      # pinned Paseo, so the Configuration tab and Paseo's provider list agree.
      - name: Check the providers option against the pinned Paseo
        run: |
          pin="$(awk '/^ *PASEO_VERSION:/{print $2; exit}' paseo/build.yaml)"
          bash .github/scripts/check-providers.sh "${pin}" paseo/config.yaml

  # Warn when add-on files change without a version bump: users only receive a
  # change once `version` in paseo/config.yaml is bumped (and tagged).
  version-bump:
    name: Version bump reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Warn if shipped files changed without a bump
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE}...HEAD" -- paseo \
            | grep -vE '^paseo/(tests/|CHANGELOG\.md|DOCS\.md|README\.md|translations/)' || true)"
          [[ -z "${changed}" ]] && { echo "No shipped files changed."; exit 0; }
          old="$(git show "origin/${BASE}:paseo/config.yaml" | grep -m1 '^version:' || true)"
          new="$(grep -m1 '^version:' paseo/config.yaml)"
          if [[ "${old}" == "${new}" ]]; then
            echo "::warning title=No version bump::Shipped files changed but 'version' in paseo/config.yaml did not. Users will not receive this until it is bumped."
            printf '%s\n' "${changed}"
          else
            echo "Version bumped: ${old} -> ${new}"
          fi
